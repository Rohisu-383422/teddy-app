      .font-display{ font-family:'Fredoka', ui-rounded, system-ui, sans-serif; }
      @keyframes popIn{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.08);opacity:1;} 100%{transform:scale(1);} }
      @keyframes confettiFall{ 0%{transform:translateY(0) rotate(0deg);opacity:1;} 100%{transform:translateY(140px) rotate(260deg);opacity:0;} }
      @keyframes gentlePulse{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
      @keyframes blobDrift{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(3%,-4%) scale(1.08);} }
      .animate-pop-in{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both; }

          constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, error };
          }
          render() {
            if (this.state.hasError) {
              return (
                <div className="p-8 h-screen bg-red-50 flex flex-col items-center justify-center text-center">
                  <div className="bg-white p-8 rounded-2xl shadow-xl border border-red-200 max-w-2xl w-full">
                    <h2 className="text-2xl font-bold text-red-600 mb-4">予期せぬエラーが発生しました</h2>
                    <p className="text-slate-600 mb-4">プログラムの実行中に問題が起きました。</p>
                    <pre className="text-sm bg-slate-100 p-4 rounded text-left overflow-auto mb-6 text-slate-800">{this.state.error && this.state.error.toString()}</pre>

                if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } else { if (height > maxWidth) { width *= maxWidth / height; height = maxWidth; } }

                <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-8 animate-in fade-in duration-200" onClick={() => setFocusedQ(null)}><div className="bg-white p-12 rounded-3xl shadow-2xl max-w-5xl w-full max-h-[85vh] overflow-y-auto relative text-center flex flex-col items-center" onClick={(e) => e.stopPropagation()}><button onClick={() => setFocusedQ(null)} className="absolute top-6 right-6 p-2 hover:bg-slate-100 rounded-full text-slate-400"><X size={32} /></button><div className="flex items-center gap-2 mb-8 bg-pink-50 px-4 py-2 rounded-full"><User size={16} className="text-pink-600"/><span className="font-bold text-pink-600 text-lg">{focusedQ.user}</span></div><p className="font-display text-4xl md:text-6xl font-semibold text-slate-800 leading-tight whitespace-pre-wrap mb-10">{focusedQ.text}</p><div className="flex items-center gap-2 text-pink-600 mb-8"><ThumbsUp size={32} className="fill-pink-500" /><span className="text-4xl font-bold">{focusedQ.likes || 0}</span></div>{isHost && (<div className="flex gap-4 border-t border-slate-100 pt-8 w-full justify-center"><button onClick={() => { onMarkAnswered(focusedQ.id, !focusedQ.answered); setFocusedQ(null); }} className={`px-8 py-4 rounded-2xl font-bold text-xl flex items-center gap-2 transition-all shadow-lg ${focusedQ.answered ? 'bg-slate-200 text-slate-600' : 'bg-green-600 text-white hover:bg-green-700'}`}><Check size={28} /> {focusedQ.answered ? '未回答に戻す' : '回答済みにする'}</button></div>)}</div></div>
              )}
            </div>
          );
        };

        const ContentVis = ({ question }) => {
            const titleLen = (question.question || '').length;
            const titleSizeWithImage = titleLen > 60 ? 'text-xl md:text-2xl lg:text-3xl' : titleLen > 35 ? 'text-2xl md:text-3xl lg:text-4xl' : titleLen > 18 ? 'text-3xl md:text-4xl lg:text-5xl' : 'text-4xl md:text-5xl lg:text-6xl xl:text-7xl';
            const titleSizeNoImage = titleLen > 60 ? 'text-2xl md:text-3xl lg:text-4xl' : titleLen > 35 ? 'text-3xl md:text-4xl lg:text-5xl xl:text-6xl' : titleLen > 18 ? 'text-4xl md:text-5xl lg:text-6xl xl:text-7xl' : 'text-5xl md:text-7xl lg:text-8xl xl:text-9xl';
            if (question.image) {
                return (
                    <div className="w-full h-full flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-16 p-4 md:p-8 animate-in fade-in">
                        <div className="w-full lg:w-1/2 h-[40vh] lg:h-full max-h-[75vh] rounded-3xl overflow-hidden shadow-sm bg-slate-50 flex-shrink-0 flex items-center justify-center border border-slate-100">
                            <img src={question.image} className="max-w-full max-h-full object-contain" alt="Slide visual" />
                        </div>
                        <div className="w-full lg:w-1/2 flex flex-col justify-center text-left h-full overflow-y-auto pr-4 lg:pr-8 py-4">
                            <h2 className={`font-display ${titleSizeWithImage} font-semibold text-slate-800 mb-6 md:mb-10 leading-tight break-words w-full`}>{question.question}</h2>
                            {question.options && question.options[0] && <p className="text-xl md:text-2xl lg:text-3xl xl:text-4xl text-slate-600 leading-relaxed whitespace-pre-wrap">{question.options[0]}</p>}
                        </div>
                    </div>
                )
            }

            return (
                <div className="w-full h-full flex flex-col items-center justify-center p-8 md:p-16 text-center animate-in fade-in overflow-y-auto">
                   <h2 className={`font-display ${titleSizeNoImage} font-semibold text-slate-800 mb-10 max-w-6xl leading-tight break-words w-full flex-shrink-0`}>{question.question}</h2>
                   <div className="w-32 h-2 bg-gradient-to-r from-orange-400 to-pink-400 rounded-full mb-10 mx-auto flex-shrink-0"></div>
                   {question.options && question.options[0] && <p className="text-2xl md:text-4xl lg:text-5xl text-slate-600 max-w-5xl leading-relaxed whitespace-pre-wrap">{question.options[0]}</p>}
                </div>
            )
        };

        const BuzzerVis = ({ votes, soundEnabled, isHost, onDelete }) => {
          const sortedVotes = useMemo(() => {
            return [...(votes || [])].sort((a, b) => a.timestamp - b.timestamp);
          }, [votes]);
          
          const prevCount = useRef(sortedVotes.length);
          
          useEffect(() => {
            if (sortedVotes.length > prevCount.current) {
              if (soundEnabled) playSound('buzzer'); 
            }
            prevCount.current = sortedVotes.length;
          }, [sortedVotes.length, soundEnabled]);

          if (sortedVotes.length === 0) {
            return <div className="flex flex-col items-center justify-center h-full text-slate-400"><Zap size={80} className="mb-6 opacity-30" /><p className="text-2xl">早押し待ちです...</p></div>
          }

          return (
            <div className="w-full h-full overflow-y-auto p-4 md:p-8 flex flex-col gap-4">
              {sortedVotes.map((v, idx) => (
                <div key={v.timestamp} className={`p-4 md:p-6 rounded-3xl shadow-sm border flex items-center gap-4 md:gap-6 relative group animate-in slide-in-from-bottom-5 fade-in duration-300 ${idx === 0 ? 'bg-gradient-to-r from-amber-50 to-orange-50 border-amber-300 ring-4 ring-amber-200 shadow-xl' : 'bg-white border-slate-100'}`}>
                  <div className={`w-12 h-12 md:w-20 md:h-20 flex-shrink-0 flex items-center justify-center rounded-full font-black text-xl md:text-4xl shadow-lg ${idx === 0 ? 'bg-gradient-to-br from-yellow-300 to-orange-500 text-white' : 'bg-slate-200 text-slate-600'}`}>
                    {idx === 0 ? <Trophy size={36} /> : idx + 1}
                  </div>
                  <div className="flex-1">
                     <div className="font-display text-2xl md:text-5xl font-semibold text-slate-800">{v.user}</div>
                     {idx === 0 && <div className="text-orange-600 font-bold text-sm md:text-xl mt-2 flex items-center gap-1"><Zap size={16}/> 1番乗り！</div>}
                  </div>
                  <div className="text-slate-400 text-xs md:text-lg font-mono font-bold bg-slate-100 px-3 py-1 rounded-lg">
                      {new Date(v.timestamp).toLocaleTimeString('ja-JP', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit', fractionalSecondDigits: 2 })}
                  </div>
                  {isHost && (
                      <button onClick={(e) => { e.stopPropagation(); if(confirm(`${v.user}さんの記録を削除しますか？`)) onDelete(v); }} className="absolute top-1/2 -translate-y-1/2 right-4 p-3 bg-white/90 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full shadow opacity-0 group-hover:opacity-100 transition-all z-10" title="この記録を消す">
                          <Trash2 size={24} />
                      </button>
                  )}
                </div>
              ))}
            </div>
          )
        };

        const DrawingVis = ({ votes, isHost, onDelete }) => {
          const [focusedVote, setFocusedVote] = useState(null);
          const displayVotes = (votes || []).slice().reverse();
          
          return (
            <div className="w-full h-full overflow-y-auto p-4 md:p-8">
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                {displayVotes.map((vote, idx) => (
                  <div key={idx} onClick={() => setFocusedVote(vote)} className="bg-white p-3 rounded-2xl shadow-sm border border-amber-100 relative group cursor-pointer hover:shadow-md hover:border-amber-200 transition-all hover:scale-105">
                     <div className="flex items-center gap-2 mb-2 px-2"><User size={14} className="text-slate-400"/> <span className="text-sm font-bold text-slate-600 truncate">{vote.user}</span></div>
                     <div className="aspect-video w-full rounded-xl overflow-hidden border border-slate-200 bg-slate-50 flex items-center justify-center">
                         <img src={vote.image} className="w-full h-full object-contain" alt="drawing" />
                     </div>
                     {isHost && <button onClick={(e) => { e.stopPropagation(); if(confirm('この作品を削除しますか？')) onDelete(vote); }} className="absolute top-2 right-2 p-2 bg-white/90 text-slate-400 hover:text-red-500 rounded-full shadow-sm opacity-0 group-hover:opacity-100 transition-all z-10"><Trash2 size={16}/></button>}
                     <div className="absolute bottom-2 right-2 p-1 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity"><Maximize2 size={16} /></div>
                  </div>
                ))}
              </div>
              {displayVotes.length === 0 && <div className="flex flex-col items-center justify-center h-full text-slate-400 gap-3"><div className="p-5 rounded-full bg-amber-50"><Palette size={48} className="text-amber-300" /></div><p className="text-xl">作品を待っています...</p></div>}
              
              {focusedVote && (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 md:p-8 animate-in fade-in duration-200" onClick={() => setFocusedVote(null)}>
                    <div className="bg-white p-4 md:p-8 rounded-3xl shadow-2xl max-w-5xl w-full flex flex-col items-center relative" onClick={(e) => e.stopPropagation()}>
                        <button onClick={() => setFocusedVote(null)} className="absolute top-4 right-4 p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-500 transition-colors"><X size={24} /></button>
                        <div className="flex items-center gap-2 bg-slate-100 text-slate-600 px-6 py-2 rounded-full font-bold mb-6 text-lg mt-2"><User size={20}/>{focusedVote.user} さんの作品</div>
                        <div className="w-full border-2 border-slate-200 rounded-2xl overflow-hidden bg-slate-50">
                            <img src={focusedVote.image} className="w-full max-h-[65vh] object-contain" alt="drawing preview" />
                        </div>
                    </div>
                </div>
              )}
            </div>
          );
        };

        const MatrixVis = ({ question, isHost, onDelete }) => {
            const { options = [], votes = [] } = question;
            const [topLabel, bottomLabel, leftLabel, rightLabel] = options;
            const [focusedVote, setFocusedVote] = useState(null);

            return (
                <div className="w-full h-full flex items-center justify-center p-0 md:p-2 relative" onClick={() => setFocusedVote(null)}>
                    <div className="relative h-full max-w-full aspect-square bg-white border-4 md:border-8 border-fuchsia-200 rounded-2xl md:rounded-3xl shadow-inner overflow-hidden mx-auto">
                        <div className="absolute inset-0 grid grid-cols-4 grid-rows-4 pointer-events-none opacity-30">
                            {[...Array(16)].map((_, i) => <div key={i} className="border border-slate-300"></div>)}
                        </div>

                        <div className="absolute top-0 bottom-0 left-1/2 w-1 md:w-1.5 bg-slate-400 -translate-x-1/2 pointer-events-none" />
                        <div className="absolute left-0 right-0 top-1/2 h-1 md:h-1.5 bg-slate-400 -translate-y-1/2 pointer-events-none" />
                        
                        {/* ★修正: whitespace-nowrapを外し、max-wを設定して自動折り返し(break-words)を有効化 */}
                        <div className="absolute top-4 md:top-6 left-1/2 -translate-x-1/2 font-black text-slate-700 bg-white/90 px-4 md:px-6 py-1.5 md:py-2 rounded-2xl shadow-sm text-sm md:text-xl border border-slate-100 pointer-events-none text-center max-w-[40%] break-words leading-tight">{topLabel || '上'}</div>
                        <div className="absolute bottom-4 md:bottom-6 left-1/2 -translate-x-1/2 font-black text-slate-700 bg-white/90 px-4 md:px-6 py-1.5 md:py-2 rounded-2xl shadow-sm text-sm md:text-xl border border-slate-100 pointer-events-none text-center max-w-[40%] break-words leading-tight">{bottomLabel || '下'}</div>
                        <div className="absolute left-4 md:left-6 top-1/2 -translate-y-1/2 font-black text-slate-700 bg-white/90 px-4 md:px-6 py-1.5 md:py-2 rounded-2xl shadow-sm text-sm md:text-xl border border-slate-100 pointer-events-none text-center max-w-[35%] break-words leading-tight">{leftLabel || '左'}</div>
                        <div className="absolute right-4 md:right-6 top-1/2 -translate-y-1/2 font-black text-slate-700 bg-white/90 px-4 md:px-6 py-1.5 md:py-2 rounded-2xl shadow-sm text-sm md:text-xl border border-slate-100 pointer-events-none text-center max-w-[35%] break-words leading-tight">{rightLabel || '右'}</div>

                        {(votes || []).map((v, i) => {
                            const isFocused = focusedVote === (v.timestamp || i);
                            return (
                                <div key={v.timestamp || i} 
                                     className="absolute z-10 cursor-pointer" 
                                     style={{ left: `${v.x * 100}%`, top: `${v.y * 100}%` }}
                                     onClick={(e) => { e.stopPropagation(); setFocusedVote(isFocused ? null : (v.timestamp || i)); }}
                                >
                                    <div className="absolute w-8 h-8 md:w-12 md:h-12 transform -translate-x-1/2 -translate-y-1/2"></div>
                                    <div className={`absolute w-3 h-3 md:w-5 md:h-5 rounded-full shadow-[0_0_8px_rgba(217,70,239,0.6)] border-2 border-white transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-300 ${isFocused ? 'bg-fuchsia-600 scale-[2.5] ring-2 ring-fuchsia-300' : 'bg-fuchsia-500 hover:scale-150'}`}></div>
                                    <div className={`absolute top-full left-1/2 -translate-x-1/2 mt-2 md:mt-4 text-xs md:text-base font-bold text-slate-700 bg-white px-3 py-1.5 rounded-lg md:rounded-xl shadow-lg whitespace-nowrap transition-all duration-200 pointer-events-none border border-slate-200 ${isFocused ? 'opacity-100 transform translate-y-0' : 'opacity-0 transform -translate-y-2'}`}>
                                        {v.user}
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 border-4 md:border-[6px] border-transparent border-b-white"></div>
                                    </div>
                                    {isHost && isFocused && (
                                        <button onClick={(e) => { e.stopPropagation(); if(confirm(`${v.user}さんの点を削除しますか？`)) { onDelete(v); setFocusedVote(null); } }} className="absolute -top-10 md:-top-12 left-1/2 -translate-x-1/2 p-1.5 md:p-2 bg-white text-red-500 hover:bg-red-50 rounded-full shadow-lg transition-all z-20 border border-slate-200">
                                            <Trash2 size={16} />
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- ★新規追加: スケール (Scale) 用の表示コンポーネント (ホスト用平均値グラフ) ---
        const ScaleVis = ({ question }) => {
            const { options = [], votes = [] } = question;
            const maxScore = 5;

            return (
                <div className="w-full h-full flex flex-col justify-center p-4 md:p-12 overflow-y-auto space-y-6 md:space-y-10">
                    {options.map((opt, idx) => {
                        // 各項目の平均値を計算
                        const sum = (votes || []).reduce((acc, v) => acc + (v.ratings?.[opt] || 0), 0);
                        const avg = (votes && votes.length > 0) ? (sum / votes.length).toFixed(1) : "0.0";
                        const widthPercent = (avg / maxScore) * 100;
                        
                        return (
                            <div key={opt} className="w-full max-w-4xl mx-auto flex flex-col gap-2 animate-in slide-in-from-left duration-500" style={{ animationDelay: `${idx * 100}ms` }}>
                                <div className="flex justify-between items-end mb-1">
                                    <span className="font-bold text-slate-700 text-xl md:text-4xl truncate pr-4">{opt}</span>
                                    <div className="flex items-baseline gap-1">
                                        <span className="font-display text-4xl md:text-6xl font-semibold text-violet-600 leading-none">{avg}</span>
                                        <span className="text-lg md:text-2xl font-bold text-slate-400">/ 5</span>
                                    </div>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-8 md:h-12 overflow-hidden relative shadow-inner">
                                    {/* グラフのバー部分 */}
                                    <div className={`h-full rounded-full transition-all duration-1000 ease-out ${COLORS[idx % COLORS.length]}`} style={{ width: `${Math.max(widthPercent, 1)}%` }} />
                                    {/* 目盛り線の描画 (1~5) */}
                                    <div className="absolute inset-0 flex justify-between items-center pointer-events-none opacity-40 px-2">
                                        {[1,2,3,4,5].map(n => <div key={n} className="h-full w-0.5 bg-slate-500"></div>)}
                                    </div>
                                </div>
                            </div>
                        )
                    })}
                </div>
            )
        };

        const ReactionVis = ({ votes, hideText }) => (
          <div className="w-full h-full flex flex-col items-center justify-center gap-6 md:gap-16 relative">
            <FloatingReactions votes={votes} />
            <div className="flex items-end justify-center gap-8 md:gap-16 relative z-10">
              {[{icon: ThumbsUp, key: 'like', color: 'teal'}, {icon: Heart, key: 'heart', color: 'pink'}, {icon: Smile, key: 'smile', color: 'amber'}].map((item, i) => (
                <div key={item.key} className="flex flex-col items-center gap-4 animate-bounce" style={{ animationDuration: `${2 - i * 0.2}s` }}><item.icon className={`w-16 h-16 md:w-32 md:h-32 text-${item.color}-500 fill-${item.color}-100 drop-shadow-lg`} /><span className={`font-display text-4xl md:text-6xl font-semibold text-${item.color}-600`}>{(votes || {})[item.key] || 0}</span></div>
              ))}
            </div>
            {!hideText && <p className="text-slate-500 relative z-10 text-sm md:text-2xl font-bold mt-4">ボタンをタップして反応を送ってください</p>}
          </div>
        );

        const DrawingCanvas = ({ onSubmit, theme, isLocked }) => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [color, setColor] = useState('#1e293b');
            const [lineWidth, setLineWidth] = useState(4);

            useEffect(() => {
                const canvas = canvasRef.current;
                const container = containerRef.current;
                if (!canvas || !container) return;
                
                canvas.width = container.clientWidth;
                // スマホの画面比率に合わせつつ、PCでは広く描けるように最大サイズを調整
                canvas.height = Math.min(window.innerHeight * 0.6, 600); 
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }, []);

            const startDrawing = (e) => {
                if (isLocked) return;
                e.preventDefault(); 
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing || isLocked) return;
                e.preventDefault(); 
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            };

            const stopDrawing = () => { setIsDrawing(false); };

            const clearCanvas = () => {
                if (isLocked) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            };

            const handleSubmit = () => {
                if (isLocked) return;
                const canvas = canvasRef.current;
                const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                onSubmit(dataUrl);
            };

            return (
                <div className="w-full flex flex-col gap-4 animate-in fade-in">
                    <div className="flex items-center justify-between bg-amber-50 border border-amber-100 p-2 md:p-3 rounded-xl max-w-md mx-auto w-full">
                        <div className="flex gap-2 md:gap-3">
                            {['#1e293b', '#ef4444', '#3b82f6', '#22c55e'].map(c => (
                                <button key={c} onClick={() => setColor(c)} className={`w-8 h-8 md:w-10 md:h-10 rounded-full border-2 transition-transform ${color === c ? 'scale-110 border-amber-400 shadow-sm' : 'border-transparent'}`} style={{ backgroundColor: c }} />
                            ))}
                        </div>
                        <div className="flex gap-2 md:gap-3 items-center">
                           <button onClick={() => setLineWidth(4)} className={`w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center bg-white border ${lineWidth === 4 ? 'border-amber-400 shadow-inner' : 'border-transparent'}`}><div className="w-1.5 h-1.5 md:w-2 md:h-2 bg-slate-800 rounded-full"/></button>
                           <button onClick={() => setLineWidth(10)} className={`w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center bg-white border ${lineWidth === 10 ? 'border-amber-400 shadow-inner' : 'border-transparent'}`}><div className="w-3 h-3 md:w-4 md:h-4 bg-slate-800 rounded-full"/></button>
                           <button onClick={clearCanvas} className="ml-2 md:ml-4 px-3 md:px-4 py-1.5 md:py-2 bg-white border border-slate-300 rounded-lg text-xs md:text-sm font-bold text-slate-600 hover:bg-red-50 hover:text-red-500 hover:border-red-200 transition-colors shadow-sm">全消去</button>
                        </div>
                    </div>
                    
                    <div ref={containerRef} className="w-full max-w-2xl mx-auto rounded-2xl md:rounded-3xl overflow-hidden border-2 md:border-4 border-amber-200 shadow-inner bg-white relative">
                        {isLocked && <div className="absolute inset-0 bg-white/50 z-10 flex items-center justify-center"><Lock size={32} className="text-slate-400"/></div>}
                        <canvas
                            ref={canvasRef}
                            className={`w-full touch-none ${isLocked ? 'cursor-not-allowed' : 'cursor-crosshair'}`}
                            onMouseDown={startDrawing}
                            onMouseMove={draw}
                            onMouseUp={stopDrawing}
                            onMouseOut={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={draw}
                            onTouchEnd={stopDrawing}
                        />
                    </div>
                    
                    <button 
                        onClick={handleSubmit} 
                        disabled={isLocked}
                        className={`w-full max-w-2xl mx-auto py-4 md:py-5 text-white rounded-xl font-bold md:text-xl flex items-center justify-center gap-2 transition-all shadow-md hover:-translate-y-1 hover:shadow-lg bg-gradient-to-r from-amber-500 to-orange-500 ${isLocked ? 'opacity-50 hover:translate-y-0 hover:shadow-md' : 'hover:from-amber-600 hover:to-orange-600'}`}
                    >
                        作品を送信 <Send size={24} />
                    </button>
                </div>
            );
        };

        const MatrixInput = ({ question, onSubmit, hasVoted, isLocked, theme }) => {
            const { options = [] } = question;
            const [topLabel, bottomLabel, leftLabel, rightLabel] = options;
            const containerRef = useRef(null);

            const handleClick = (e) => {
                if (hasVoted || isLocked) return;
                const rect = containerRef.current.getBoundingClientRect();
                const clientX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;
                
                const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                
                onSubmit({ x, y });
            };

            return (

            const [ratings, setRatings] = useState({});

                if (isOpen && initialConfig) {
                    setConfigStr(JSON.stringify(initialConfig, null, 2));
                }
            }, [isOpen, initialConfig]);

            if (!isOpen) return null;

            const handleSave = () => {
                try {
                    let input = configStr.trim();
                    
                    const scriptMatch = input.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
                    if (scriptMatch) {
                        input = scriptMatch[1];
                    }
                    
                    const configMatch = input.match(/firebaseConfig\s*=\s*({[\s\S]*?});/);
                    if (configMatch) {
                        input = configMatch[1];
                    } else {
                        input = input.replace(/^(const|let|var)\s+firebaseConfig\s*=\s*/, '').trim();
                        if (input.endsWith(';')) input = input.slice(0, -1);
                    }

                    const parsed = new Function("return " + input)();
                    if (!parsed || typeof parsed !== 'object' || !parsed.apiKey || !parsed.projectId) {
                        throw new Error("Invalid config format");
                    }
                    onSave(parsed);
                } catch (e) {
                    setError("設定の形式が正しくありません。Firebaseコンソールからコピーした内容（firebaseConfigの部分）を確認してください。");

        const CreateQuestionModal = ({ isOpen, onClose, onSave, initialData = null, theme }) => {
          const [type, setType] = useState('choice'); const [question, setQuestion] = useState(''); const [optionsStr, setOptionsStr] = useState(''); const [image, setImage] = useState(null); const [correctOption, setCorrectOption] = useState(null); const [notes, setNotes] = useState(''); const fileInputRef = useRef(null);

            let newQuestion = { id: initialData ? initialData.id : Date.now().toString(), question, type, image, isLocked: initialData ? initialData.isLocked : false, timerEndsAt: initialData ? initialData.timerEndsAt : null, votes: initialData ? initialData.votes : (['open', 'buzzer', 'drawing', 'matrix', 'scale'].includes(type) ? [] : (type === 'qa' || type === 'wordcloud' ? {} : (type === 'reaction' ? { like: 0, heart: 0, smile: 0 } : {}))), order: initialData ? initialData.order : 0, correctOption: type === 'choice' ? correctOption : null, isAnswerRevealed: initialData ? initialData.isAnswerRevealed : false, notes: notes };
            
            // ★修正: scaleの場合もoptionsに評価項目の配列を保存する
            if (['choice', 'ranking', 'matrix', 'scale'].includes(type)) {

                // choice, rankingの場合だけ初期votesをセットする
                if (!initialData && type !== 'matrix' && type !== 'scale') { const initialVotes = {}; opts.forEach(o => initialVotes[o] = 0); newQuestion.votes = initialVotes; } 
            } 
            if (type === 'choice' || type === 'ranking') { newQuestion.allowedVisuals = type === 'choice' ? ['bar', 'donut'] : ['ranking']; }
            else if (type === 'wordcloud') { newQuestion.allowedVisuals = ['cloud', 'list']; } else if (type === 'open') { newQuestion.allowedVisuals = ['grid']; } else if (type === 'reaction') { newQuestion.allowedVisuals = ['floating']; } else if (type === 'qa') { newQuestion.allowedVisuals = ['list']; } else if (type === 'content') { newQuestion.options = [optionsStr]; newQuestion.allowedVisuals = ['content']; } else if (type === 'buzzer') { newQuestion.allowedVisuals = ['buzzer']; } else if (type === 'drawing') { newQuestion.allowedVisuals = ['gallery']; } else if (type === 'matrix') { newQuestion.allowedVisuals = ['scatter']; } else if (type === 'scale') { newQuestion.allowedVisuals = ['bars']; }
            onSave(newQuestion); onClose();
          };
          const currentOptions = optionsStr.split(',').map(s => s.trim()).filter(s => s);

          return (
            <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-slate-800 mb-6 flex justify-between">{initialData ? 'スライドを編集' : '新しいスライドを作成'}<button onClick={onClose}><X size={20} className="text-slate-400 hover:text-slate-600" /></button></h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-600 mb-2">タイプ</label>
                    <div className="grid grid-cols-4 gap-2">
                      {/* ★修正: スケール(scale)の選択肢を追加 */}
                      {[{ id: 'choice', label: '選択/クイズ', icon: <BarChart3 size={16} /> }, { id: 'ranking', label: 'ランク', icon: <ListOrdered size={16} /> }, { id: 'scale', label: 'スケール', icon: <SlidersHorizontal size={16} /> }, { id: 'matrix', label: '2軸マップ', icon: <Target size={16} /> }, { id: 'buzzer', label: '早押し', icon: <Zap size={16} /> }, { id: 'drawing', label: 'お絵かき', icon: <Palette size={16} /> }, { id: 'wordcloud', label: 'ワード', icon: <Type size={16} /> }, { id: 'open', label: '自由', icon: <MessageSquare size={16} /> }, { id: 'qa', label: 'Q&A', icon: <HelpCircle size={16} /> }, { id: 'content', label: '説明', icon: <FileText size={16} /> }, { id: 'reaction', label: '反応', icon: <ThumbsUp size={16} /> }].map((t) => (

                      ))}
                    </div>
                  </div>
                  <div><label className="block text-sm font-semibold text-slate-600 mb-2">タイトル / 質問</label><input type="text" value={question} onChange={(e) => setQuestion(e.target.value)} className={`w-full p-3 rounded-lg border border-slate-300 ${THEMES[theme].ring}`} placeholder="タイトルを入力" /></div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-600 mb-2">画像 (任意)</label>
                    {!image ? (<div onClick={() => fileInputRef.current?.click()} className="w-full h-24 border-2 border-dashed border-orange-200 rounded-lg flex flex-col items-center justify-center text-orange-400 cursor-pointer hover:bg-orange-50 transition-colors"><Upload size={20} /><span className="text-xs mt-1">画像を選択</span><input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageUpload} /></div>) : (<div className="relative w-full h-32 bg-slate-100 rounded-lg overflow-hidden"><img src={image} className="w-full h-full object-contain" /><button onClick={() => {setImage(null); if(fileInputRef.current) fileInputRef.current.value=""}} className="absolute top-1 right-1 p-1 bg-black/50 text-white rounded-full"><X size={14}/></button></div>)}
                  </div>
                  {(['choice', 'ranking', 'matrix', 'scale'].includes(type)) && (
                    <div>
                      {/* ★修正: スケールのプレースホルダーを分岐 */}
                      <label className="block text-sm font-semibold text-slate-600 mb-2">
                        {type === 'matrix' ? '軸ラベル (上, 下, 左, 右 の順でカンマ区切り)' : (type === 'scale' ? '評価項目 (カンマ区切り)' : '選択肢 (カンマ区切り)')}
                      </label>
                      <textarea value={optionsStr} onChange={(e) => setOptionsStr(e.target.value)} className={`w-full p-3 rounded-lg border border-slate-300 h-20 resize-none ${THEMES[theme].ring}`} placeholder={type === 'matrix' ? "例: 楽しい, キツイ, 難しい, 簡単" : (type === 'scale' ? "例: 理解度, 満足度, 難易度" : "A, B, C")} />
                      {type === 'choice' && currentOptions.length > 0 && (
                        <div className="mt-4 p-3 rounded-lg bg-amber-50 border border-amber-200"><label className="block text-xs font-bold text-amber-700 mb-2 flex items-center gap-1"><Award size={12}/> クイズ: 正解を選択 (任意)</label><div className="space-y-2"><label className="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="correctOption" checked={correctOption === null} onChange={() => setCorrectOption(null)} className="accent-indigo-600" /><span className="text-slate-600">正解なし (アンケート)</span></label>{currentOptions.map((opt, idx) => (<label key={idx} className="flex items-center gap-2 text-sm cursor-pointer"><input type="radio" name="correctOption" value={opt} checked={correctOption === opt} onChange={() => setCorrectOption(opt)} className="accent-green-600" /><span className={correctOption === opt ? 'font-bold text-green-700' : 'text-slate-700'}>{opt}</span></label>))}</div></div>
                      )}

                  {type === 'content' && (<div><label className="block text-sm font-semibold text-slate-600 mb-2">本文 / 説明</label><textarea value={optionsStr} onChange={(e) => setOptionsStr(e.target.value)} className={`w-full p-3 rounded-lg border border-slate-300 h-32 resize-none ${THEMES[theme].ring}`} placeholder="スライドに表示するテキスト..." /></div>)}
                  <div><label className="block text-sm font-semibold text-slate-600 mb-2">発表者用メモ</label><textarea value={notes} onChange={(e) => setNotes(e.target.value)} className={`w-full p-3 rounded-lg border border-slate-300 h-20 resize-none ${THEMES[theme].ring}`} placeholder="カンペや時間配分など..." /></div>

              </div>
            </div>
          );
        };

        const LandingPage = ({ onCreate, onJoin, customLogo, setCustomLogo, theme, setTheme, onOpenSettings }) => {

                  title="Firebase設定"
              >
                  <Settings size={20} /> <span className="text-sm font-bold hidden md:inline">設定</span>

              <div className="relative z-10 max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl ring-4 ring-white/70 mt-8">

                <h1 className="font-display text-3xl font-semibold text-slate-800 mb-2">Teddy</h1><p className="text-slate-500 mb-8">リアルタイム投票 & 視覚化ツール</p>

                <form onSubmit={(e) => { e.preventDefault(); if(joinCode) onJoin(joinCode); }} className="space-y-3">

        // --- Main Application ---
        function App() {
          const [isFirebaseReady, setIsFirebaseReady] = useState(false);

          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [savedConfig, setSavedConfig] = useState(null);

          const [user, setUser] = useState(null);

          const [sessionData, setSessionData] = useState(null);
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [editingQuestion, setEditingQuestion] = useState(null);
          const [visualType, setVisualType] = useState('default');

          const [showNotes, setShowNotes] = useState(false);
          const [selectedTheme, setSelectedTheme] = useState('indigo');
          const configInputRef = useRef(null);

          const addToast = (message, type = 'success') => {
            const id = Date.now(); setToasts(prev => [...prev, { id, message, type }]);
            setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 5000); 
          };

          const activeQuestion = sessionData ? sessionData.questions[sessionData.activeQuestionId] : null;
          const currentTheme = sessionData?.theme || selectedTheme || 'indigo';
          
          const currentVisual = (activeQuestion && (!sessionData?.currentVisual || sessionData.currentVisual === 'default')) ? activeQuestion.allowedVisuals[0] : sessionData?.currentVisual;

              // ★修正: スケール(scale)の削除処理を追加
              else if (['open', 'buzzer', 'drawing', 'matrix', 'scale'].includes(question.type)) { 
                  await getSessionRef(firebaseInstance.db, roomId).update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayRemove(value) }); 
              }
              addToast('削除しました');
            } catch (e) { console.error(e); addToast("削除に失敗しました", 'error'); }
          };

          const markQaAnswered = async (msgId, isAnswered) => { 
            if (!isFirebaseReady || !user || !roomId || !sessionData) return; const qId = sessionData.activeQuestionId; 
            try { await getSessionRef(firebaseInstance.db, roomId).update({ [`questions.${qId}.votes.${msgId}.answered`]: isAnswered }); }
            catch(e) { console.error(e); addToast('エラーが発生しました', 'error'); }
          };

          const submitVote = async (value) => {
            if (!isFirebaseReady || !user || !roomId || !sessionData) return; 
            const qId = sessionData.activeQuestionId;
            
            // ★修正: スケール(scale)も1回制限に追加
            if (['choice', 'ranking', 'reaction', 'buzzer', 'drawing', 'matrix', 'scale'].includes(sessionData.questions[qId].type)) {
               if (votedQuestions.includes(qId)) { addToast("すでに送信済みです", 'error'); return; }
               const newVoted = [...votedQuestions, qId]; setVotedQuestions(newVoted); localStorage.setItem('teddy_voted_questions', JSON.stringify(newVoted));
            }

            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(50);
            const question = sessionData.questions[qId]; const docRef = getSessionRef(firebaseInstance.db, roomId);
            try {
              if (question.type === 'choice' || question.type === 'reaction' || question.type === 'wordcloud') { await docRef.update({ [`questions.${qId}.votes.${value}`]: window.firebase.firestore.FieldValue.increment(1) }); } 
              else if (question.type === 'open') { await docRef.update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayUnion({ text: value, user: voterName || 'Anonymous' }) }); } 
              else if (question.type === 'buzzer') { await docRef.update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayUnion({ user: voterName || 'Anonymous', timestamp: Date.now() }) }); } 
              else if (question.type === 'drawing') { await docRef.update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayUnion({ image: value, user: voterName || 'Anonymous', timestamp: Date.now() }) }); } 
              else if (question.type === 'matrix') { await docRef.update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayUnion({ x: value.x, y: value.y, user: voterName || 'Anonymous', timestamp: Date.now() }) }); } 
              // ★修正: スケールの投票送信処理 (ratingsオブジェクトを受け取る)
              else if (question.type === 'scale') { await docRef.update({ [`questions.${qId}.votes`]: window.firebase.firestore.FieldValue.arrayUnion({ ratings: value, user: voterName || 'Anonymous', timestamp: Date.now() }) }); } 
              else if (question.type === 'ranking') { const updates = {}; value.forEach((opt, idx) => { updates[`questions.${qId}.votes.${opt}`] = window.firebase.firestore.FieldValue.increment(Math.max(3 - idx, 1)); }); await docRef.update(updates); } 
              else if (question.type === 'qa') { const msgId = Date.now().toString(); await docRef.update({ [`questions.${qId}.votes.${msgId}`]: { text: value, user: voterName || 'Anonymous', likes: 0, answered: false, createdAt: Date.now() } }); }
              if(mode === 'voter' && question.type !== 'buzzer') addToast("送信しました！"); // buzzerは派手な画面を出すためトースト不要
            } catch (e) { console.error(e); addToast("送信に失敗しました", 'error'); }
          };

          const toggleQaLike = async (msgId) => { 
            if (!isFirebaseReady || !user || !roomId || !sessionData) return; const qId = sessionData.activeQuestionId; const docRef = getSessionRef(firebaseInstance.db, roomId); 
            try { await docRef.update({ [`questions.${qId}.votes.${msgId}.likes`]: window.firebase.firestore.FieldValue.increment(1) }); } catch(e) {}
          };

                          </div>

                      <FirebaseSettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} onSave={handleSaveConfig} initialConfig={savedConfig} />

          }

          if (mode === 'host') {
            return (
              <div className="flex h-screen bg-slate-50 text-slate-800 font-sans overflow-hidden">

                <aside className="w-64 bg-white border-r border-slate-200 flex flex-col z-20 shadow-lg">
                  <div className="p-4 border-b border-slate-200 flex items-center justify-between">

                  <div className="flex-1 overflow-y-auto p-4 space-y-6">
                    <div>
                      <div className="flex items-center justify-between mb-3"><h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">スライド</h2><button onClick={() => { setEditingQuestion(null); setIsModalOpen(true); }} className="text-xs flex items-center gap-1 text-white font-bold bg-gradient-to-r from-orange-500 to-pink-500 hover:from-orange-600 hover:to-pink-600 px-2.5 py-1.5 rounded-full transition-all shadow-sm"><Plus size={12} /> 追加</button></div>

                          return (

                    <a href={`?room=${roomId}`} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 text-sm text-white bg-gradient-to-r from-teal-500 to-sky-500 hover:from-teal-600 hover:to-sky-600 py-2.5 rounded-lg transition-all font-bold shadow-sm"><ExternalLink size={16} /> 参加者画面を開く</a>
                  </div>
                </aside>

                <main className="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-orange-50 via-fuchsia-50 to-sky-50">

                       )}
                    </div>
                    {showQr && (
                      <div className="absolute inset-0 bg-white/95 z-50 flex items-center justify-center flex-col animate-in fade-in zoom-in duration-300">
                          <div className="bg-white p-8 rounded-3xl shadow-2xl text-center ring-4 ring-orange-100 max-w-sm w-full">
                              <div className="inline-block p-3 rounded-2xl bg-gradient-to-br from-orange-50 to-pink-50 mb-6"><img src={savedConfig ? `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(`${window.location.origin}${window.location.pathname.replace(/\/$/, '')}?room=${roomId}&cfg=${encodeBase64Unicode(JSON.stringify(savedConfig))}`)}` : ''} alt="QR Code" className="mx-auto rounded-lg" /></div>
                              <div className="font-display text-3xl font-semibold text-slate-800 tracking-widest mb-2">{roomId}</div>
                              <p className="text-slate-500 mb-6">スマホのカメラでスキャンして参加</p>
                              <div className="flex flex-col gap-2">
                                  <button onClick={copyLink} className="flex items-center justify-center gap-1 text-sm text-teal-600 font-bold hover:underline mb-2"><Copy size={14}/> リンクをコピー</button>
                                  <button onClick={downloadQr} className="flex items-center justify-center gap-1 text-sm text-violet-600 font-bold hover:underline mb-2"><Download size={14}/> 画像を保存</button>
                                  <button onClick={() => setShowQr(false)} className="text-slate-400 font-medium hover:text-slate-600">閉じる</button>
                              </div>
                          </div>
                      </div>
                    )}
                  </div>
                </main>
                <CreateQuestionModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={saveQuestion} initialData={editingQuestion} theme={currentTheme} />
                <ToastContainer toasts={toasts} />
              </div>
            );
          }

          if (mode === 'voter') {
            if (!voterName) {
              return (
                <div className="min-h-screen relative overflow-hidden flex flex-col items-center justify-center p-6 bg-gradient-to-br from-orange-50 via-fuchsia-50 to-sky-50">
                  <div className="pointer-events-none absolute inset-0 overflow-hidden">
                    <div className="animate-blob-drift absolute -top-20 -left-20 w-80 h-80 rounded-full bg-orange-300/30 blur-3xl"></div>
                    <div className="animate-blob-drift absolute -bottom-24 -right-20 w-96 h-96 rounded-full bg-violet-300/30 blur-3xl" style={{animationDelay:'4s'}}></div>
                  </div>
                  <div className="relative z-10 max-w-xs md:max-w-sm w-full bg-white p-8 md:p-10 rounded-3xl shadow-2xl ring-4 ring-white/70 text-center">
                    <div className="flex justify-center mb-4"><div className="p-4 rounded-full bg-gradient-to-br from-orange-400 to-pink-500 text-white shadow-lg animate-pop-in"><User size={32} /></div></div>
                    <h2 className="font-display text-2xl md:text-3xl font-semibold text-slate-800 mb-2">お名前を教えてください</h2>
                    <p className="text-xs md:text-sm text-slate-400 mb-6">投票時に表示されるニックネームです</p>
                    <form onSubmit={(e) => { e.preventDefault(); if(e.target.name.value.trim()) handleSetVoterName(e.target.name.value.trim()); }}>
                      <input name="name" type="text" placeholder="ニックネーム" className="w-full p-4 mb-6 rounded-xl border-2 border-slate-200 focus:outline-none focus:border-orange-400 focus:ring-4 focus:ring-orange-100 text-center font-bold text-lg" required autoFocus />
                      <button type="submit" className="w-full py-4 text-white rounded-xl font-bold text-lg transition-all hover:-translate-y-1 hover:shadow-lg bg-gradient-to-r from-orange-500 to-pink-500 hover:from-orange-600 hover:to-pink-600">参加する</button>
                    </form>
                  </div>
                </div>
              );
            }

            return (
              <div className="min-h-screen relative overflow-hidden flex items-center justify-center p-4 md:p-8 bg-gradient-to-br from-orange-50 via-fuchsia-50 to-sky-50">
                <div className="pointer-events-none absolute inset-0 overflow-hidden">
                  <div className="animate-blob-drift absolute -top-24 -left-24 w-96 h-96 rounded-full bg-orange-300/30 blur-3xl"></div>
                  <div className="animate-blob-drift absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-teal-300/30 blur-3xl" style={{animationDelay:'5s'}}></div>
                </div>
                <div className="relative z-10 w-full max-w-md md:max-w-2xl lg:max-w-3xl bg-white rounded-3xl shadow-2xl ring-4 ring-white/70 overflow-hidden flex flex-col h-[85vh] md:h-[90vh]">
                  {activeQuestion.isLocked && <div className="absolute inset-0 bg-white/95 z-20 flex flex-col items-center justify-center p-8 text-center animate-in fade-in"><div className="bg-gradient-to-br from-slate-100 to-slate-200 p-6 rounded-full mb-6"><Lock size={48} className="text-slate-400" /></div><h3 className="font-display text-2xl md:text-3xl font-semibold text-slate-800 mb-2">投票終了</h3><p className="text-slate-500 md:text-lg">この質問の受付は終了しました。</p></div>}
                  {timeLeft > 0 && !activeQuestion.isLocked && <div className={`absolute top-20 right-6 z-10 ${THEMES[currentTheme].bg} text-white px-4 py-1.5 rounded-full font-bold shadow-lg animate-pulse`}>あと {timeLeft} 秒</div>}
                  <div className="h-16 md:h-20 bg-white border-b flex items-center justify-between px-6">
                    <div className="flex items-center gap-2 overflow-hidden"><span className="font-display font-semibold flex-shrink-0 flex items-center gap-2 text-lg md:text-xl text-orange-500"><AppLogo customSrc={displayLogo} size={40} /> Teddy</span><span className="text-xs md:text-sm font-medium text-slate-400 truncate border-l border-slate-200 pl-3 ml-2">Hello, {voterName}</span></div>
                    <div className="flex items-center gap-4"><div className="text-xs md:text-sm font-bold bg-teal-50 px-3 py-1.5 rounded-lg text-teal-600 flex-shrink-0">Room: {roomId}</div><button onClick={exitSession} className="p-2 text-slate-400 hover:bg-red-50 hover:text-red-500 rounded-full transition-colors" title="退出"><LogOut size={20} /></button></div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 md:p-10 bg-slate-50 relative flex flex-col">
                    {activeQuestion.image && activeQuestion.type !== 'content' && <div className="w-full h-48 md:h-64 mb-6 rounded-2xl overflow-hidden bg-slate-200 flex-shrink-0 shadow-inner border border-slate-100"><img src={activeQuestion.image} className="w-full h-full object-cover" /></div>}
                    {activeQuestion.type !== 'content' && <h3 className="font-display text-xl md:text-3xl font-semibold text-slate-800 mb-8 md:mb-10 text-center leading-tight">{activeQuestion.question}</h3>}

                    {activeQuestion.isAnswerRevealed && activeQuestion.correctOption && hasVotedCurrent && (
                        <div className={`mb-6 p-6 rounded-2xl text-center font-bold text-white shadow-lg animate-in zoom-in ${votedQuestions.includes(activeQuestion.id) ? 'bg-slate-400' : 'bg-gradient-to-r from-emerald-500 to-teal-500 ring-4 ring-emerald-200' }`}><p className="text-sm md:text-base opacity-90 mb-1">正解は...</p><p className="font-display text-3xl md:text-4xl font-semibold">{activeQuestion.correctOption}</p></div>
                    )}

                    {sessionData.showResults && !activeQuestion.isLocked && activeQuestion.type !== 'buzzer' && (
                      <div className="mb-8 border-b border-slate-200 pb-8 max-w-3xl mx-auto w-full">
                        <p className="text-xs md:text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider text-center">ライブ結果</p>
                        <div className="h-56 md:h-64 overflow-hidden rounded-2xl bg-white shadow-sm border border-slate-200 relative">
                           {activeQuestion.type === 'choice' && (currentVisual === 'bar' ? <BarChartVis data={activeQuestion.votes} total={totalVotes} /> : <DonutChartVis data={activeQuestion.votes} total={totalVotes} />)}
                           {activeQuestion.type === 'ranking' && <RankingVis data={activeQuestion.votes} />}
                           {activeQuestion.type === 'wordcloud' && <WordCloudVis votes={activeQuestion.votes} isHost={false} />}
                           {activeQuestion.type === 'reaction' && <ReactionVis votes={activeQuestion.votes} hideText={true} />}
                           {activeQuestion.type === 'scale' && <div className="absolute inset-0 scale-[0.6] md:scale-75 transform origin-top"><ScaleVis question={activeQuestion} /></div>}
                        </div>
                      </div>
                    )}

                    {activeQuestion.type === 'choice' && <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 max-w-3xl mx-auto w-full">{
                       hasVotedCurrent && !activeQuestion.isAnswerRevealed
                       ? <div className="text-center py-12 text-slate-400 md:col-span-2"><CheckCircle size={64} className="mx-auto mb-4 opacity-50" /><p className="text-lg font-bold">投票を受け付けました</p></div>
                       : activeQuestion.options.map((opt, idx) => {
                           const isCorrect = activeQuestion.isAnswerRevealed && opt === activeQuestion.correctOption;
                           const isDimmed = activeQuestion.isAnswerRevealed && !isCorrect;
                           const accent = ['border-l-orange-400','border-l-teal-400','border-l-amber-400','border-l-violet-400','border-l-pink-400','border-l-sky-400'][idx % 6];
                           return (
                           <button key={opt} onClick={() => !activeQuestion.isAnswerRevealed && submitVote(opt)} disabled={activeQuestion.isAnswerRevealed} className={`w-full p-4 md:p-6 border-2 border-l-[6px] rounded-2xl shadow-sm transition-all text-left font-bold flex justify-between items-center min-h-[4rem] md:min-h-[5rem] md:text-xl ${isCorrect ? 'bg-green-100 border-green-500 text-green-700' : `bg-white border-slate-100 ${accent} text-slate-700`} ${isDimmed ? 'opacity-50' : ''} ${!activeQuestion.isAnswerRevealed && !hasVotedCurrent ? 'hover:shadow-md hover:-translate-y-1 active:scale-95' : ''}`}>
                             <span className="flex-1 break-words pr-2">{opt}</span>
                             {isCorrect && <CheckCircle size={28} className="text-green-600 flex-shrink-0 ml-2"/>}
                           </button>
                           )
                       })
                    }</div>}
                    {activeQuestion.type === 'ranking' && <div className="space-y-3 md:space-y-4 max-w-2xl mx-auto w-full">
                       {hasVotedCurrent ? <div className="text-center py-12 text-slate-400"><CheckCircle size={64} className="mx-auto mb-4 opacity-50" /><p className="text-lg font-bold">投票を受け付けました</p></div> : 
                       <><p className="text-sm md:text-base font-bold text-slate-500 text-center mb-4 bg-slate-100 py-2 rounded-full">順位をつけて最大3つ選択</p>
                       <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">{activeQuestion.options.map((opt) => { 
                           const idx = rankingSelection.indexOf(opt); const isSel = idx !== -1; 
                           return (
                               <button key={opt} onClick={() => { if(isSel) setRankingSelection(prev => prev.filter(o => o !== opt)); else if(rankingSelection.length < 3) setRankingSelection(prev => [...prev, opt]); }} className={`w-full p-4 md:p-5 border-2 rounded-xl shadow-sm transition-all text-left font-bold flex justify-between items-center md:text-lg min-h-[4rem] hover:-translate-y-1 hover:shadow-md ${isSel ? 'bg-violet-50 border-violet-400 text-violet-700' : 'bg-white border-slate-100 hover:border-slate-300'}`}>
                                   <span className="flex-1 pr-2">{opt}</span> 
                                   {isSel && <span className="w-6 h-6 md:w-8 md:h-8 flex-shrink-0 rounded-full flex items-center justify-center text-xs md:text-sm font-black shadow-sm bg-gradient-to-br from-violet-500 to-purple-600 text-white">{idx + 1}</span>}
                               </button>
                           ); 
                       })}</div>
                       <button onClick={() => {submitVote(rankingSelection); setRankingSelection([]);}} disabled={rankingSelection.length === 0} className="w-full py-4 text-white rounded-xl font-bold md:text-xl mt-6 transition-all shadow hover:-translate-y-1 hover:shadow-lg disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-none bg-gradient-to-r from-violet-500 to-purple-600 hover:from-violet-600 hover:to-purple-700">送信する</button></>}
                    </div>}
                    {activeQuestion.type === 'wordcloud' && <form onSubmit={(e) => { e.preventDefault(); const val = e.target.word.value; if(val) { submitVote(val); e.target.reset(); } }} className="space-y-4 max-w-xl mx-auto w-full"><input name="word" type="text" placeholder="回答を入力..." maxLength={20} className="w-full p-4 md:p-5 rounded-xl border-2 border-slate-200 text-lg shadow-inner focus:outline-none focus:ring-2 focus:border-teal-400 focus:ring-teal-100" autoComplete="off" /><button type="submit" className="w-full py-4 text-white rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all hover:-translate-y-1 hover:shadow-lg bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600">送信 <Send size={20} /></button></form>}
                    {activeQuestion.type === 'open' && <form onSubmit={(e) => { e.preventDefault(); const val = e.target.text.value; if(val.trim()) { submitVote(val.trim()); e.target.reset(); } }} className="space-y-4 max-w-2xl mx-auto w-full"><textarea name="text" placeholder="ここに回答を入力してください..." className="w-full p-4 md:p-5 rounded-xl border-2 border-slate-200 text-lg shadow-inner focus:outline-none focus:ring-2 focus:border-sky-400 focus:ring-sky-100 min-h-[150px] md:min-h-[200px] resize-none" /><button type="submit" className="w-full py-4 text-white rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-all hover:-translate-y-1 hover:shadow-lg bg-gradient-to-r from-sky-500 to-blue-500 hover:from-sky-600 hover:to-blue-600">送信 <Send size={20} /></button></form>}
                    {activeQuestion.type === 'qa' && (
                      <div className="space-y-8 md:space-y-10 max-w-3xl mx-auto w-full">
                        <form onSubmit={(e) => { e.preventDefault(); const val = e.target.text.value; if(val.trim()) { submitVote(val.trim()); e.target.reset(); } }} className="space-y-3 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-pink-100">
                          <textarea name="text" placeholder="質問を入力してください..." className="w-full p-4 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:border-pink-400 focus:ring-pink-100 h-24 md:h-32 resize-none text-base md:text-lg bg-slate-50" />
                          <button type="submit" className="w-full py-3 md:py-4 text-white rounded-xl font-bold text-base md:text-lg transition-all hover:-translate-y-1 hover:shadow-md bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600">質問する</button>
                        </form>
                        <div>
                          <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center gap-2"><HelpCircle size={16}/> みんなの質問</h4>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              {Object.entries(activeQuestion.votes || {}).sort((a,b) => (b[1].likes || 0) - (a[1].likes || 0)).map(([id, q]) => (
                                <div key={id} className={`bg-white p-4 md:p-5 rounded-2xl border border-slate-100 ${q.answered ? 'opacity-50' : ''} shadow-sm hover:shadow transition-shadow`}>
                                  <div className="flex justify-between gap-4">
                                    <div className="flex-1"><p className="text-sm md:text-base font-bold text-slate-800 leading-relaxed mb-2">{q.text}</p><div className="text-xs text-slate-400 flex items-center gap-1"><User size={12}/> {q.user}</div></div>
                                    <button onClick={() => toggleQaLike(id)} className="flex flex-col items-center justify-center bg-pink-50 hover:bg-pink-100 text-pink-400 hover:text-pink-600 w-12 h-12 md:w-14 md:h-14 rounded-xl transition-all hover:scale-105 active:scale-95"><ThumbsUp size={18} /><span className="text-sm font-bold mt-0.5">{q.likes || 0}</span></button>
                                  </div>
                                </div>
                              ))}
                              {Object.keys(activeQuestion.votes || {}).length === 0 && <div className="flex flex-col items-center gap-2 text-center text-pink-300 text-sm md:text-base py-8 md:col-span-2 bg-pink-50/50 rounded-2xl border border-dashed border-pink-200"><HelpCircle size={28} /><span className="text-slate-400">まだ質問はありません</span></div>}
                          </div>
                        </div>
                      </div>
                    )}
                    {activeQuestion.type === 'content' && (
                        <div className="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-100 mt-4 max-w-4xl mx-auto w-full">
                            {activeQuestion.image && <div className="w-full h-48 md:h-80 mb-6 rounded-2xl overflow-hidden bg-slate-100"><img src={activeQuestion.image} className="w-full h-full object-contain" /></div>}
                            <h3 className="font-display text-2xl md:text-4xl font-semibold text-slate-800 mb-6 leading-tight">{activeQuestion.question}</h3>
                            {activeQuestion.options && activeQuestion.options[0] && <p className="text-lg md:text-xl text-slate-600 whitespace-pre-wrap leading-relaxed">{activeQuestion.options[0]}</p>}
                        </div>
                    )}
                    
                    {activeQuestion.type === 'reaction' && (
                      <div className="w-full max-w-xl mx-auto">
                        <div className="grid grid-cols-3 gap-4 md:gap-6 mt-8">
                          {['like', 'heart', 'smile'].map(type => {
                            const style = type === 'like' ? 'bg-teal-50 text-teal-600' : type === 'heart' ? 'bg-pink-50 text-pink-600' : 'bg-amber-50 text-amber-600';
                            return (
                            <button 
                              key={type} 
                              onClick={() => !hasVotedCurrent && submitVote(type)} 
                              disabled={hasVotedCurrent}
                              className={`aspect-square ${style} rounded-3xl flex items-center justify-center transition-all ${hasVotedCurrent ? 'opacity-40 cursor-not-allowed' : 'active:scale-90 hover:brightness-95 hover:shadow-lg shadow-sm hover:-translate-y-2'}`}
                            >
                              {type==='like'?<ThumbsUp size={48} className="md:w-16 md:h-16" />:type==='heart'?<Heart size={48} className="md:w-16 md:h-16" />:<Smile size={48} className="md:w-16 md:h-16" />}
                            </button>
                            );
                          })}
                        </div>
                        {hasVotedCurrent && <p className="text-center text-sm md:text-lg font-bold text-slate-400 mt-8 animate-in fade-in">リアクションを送信しました</p>}
                      </div>
                    )}

                    {activeQuestion.type === 'buzzer' && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full py-8">
                            {hasVotedCurrent ? (
                                <div className="text-center text-slate-500 animate-in zoom-in duration-300">
                                    <CheckCircle size={80} className="mx-auto mb-4 text-green-500" />
                                    <p className="text-3xl md:text-4xl font-black mb-2 text-slate-700">送信完了！</p>
                                    <p className="text-sm md:text-lg font-bold">画面を見て結果を確認してください</p>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => submitVote('buzzer')} 
                                    className="w-64 h-64 md:w-96 md:h-96 rounded-full bg-gradient-to-br from-red-500 to-orange-600 hover:from-red-600 hover:to-orange-700 shadow-[0_20px_0_rgb(153,27,27)] md:shadow-[0_30px_0_rgb(153,27,27)] active:shadow-[0_0px_0_rgb(153,27,27)] active:translate-y-[20px] md:active:translate-y-[30px] transition-all flex flex-col items-center justify-center border-4 md:border-8 border-red-400 text-white font-black group focus:outline-none"
                                >
                                    <Zap size={64} className="md:w-24 md:h-24 mb-2 group-active:scale-90 transition-transform" />
                                    <span className="text-5xl md:text-7xl tracking-widest group-active:scale-90 transition-transform">押す</span>
                                </button>
                            )}
                        </div>
                    )}

                    {activeQuestion.type === 'drawing' && (
                        <div className="flex-1 flex flex-col items-center justify-center w-full py-2">
                            {hasVotedCurrent ? (
                                <div className="text-center text-slate-500 animate-in zoom-in duration-300">
                                    <CheckCircle size={80} className="mx-auto mb-4 text-green-500 opacity-80" />
                                    <p className="text-2xl md:text-4xl font-black mb-2 text-slate-600">作品を送信しました</p>
                                    <p className="text-sm md:text-lg font-bold">ホスト画面で確認してください</p>
                                </div>
                            ) : (
                                <DrawingCanvas onSubmit={(dataUrl) => submitVote(dataUrl)} theme={currentTheme} isLocked={activeQuestion.isLocked} />
                            )}
                        </div>
                    )}

                    {activeQuestion.type === 'matrix' && (
                         <MatrixInput question={activeQuestion} onSubmit={(data) => submitVote(data)} hasVoted={hasVotedCurrent} isLocked={activeQuestion.isLocked} theme={currentTheme} />
                    )}

                    {activeQuestion.type === 'scale' && (
                         <ScaleInput question={activeQuestion} onSubmit={(data) => submitVote(data)} hasVoted={hasVotedCurrent} isLocked={activeQuestion.isLocked} theme={currentTheme} />
                    )}

                    {sessionData.activeQuestionId && !['buzzer', 'drawing', 'matrix', 'scale'].includes(activeQuestion.type) && <FloatingReactions votes={activeQuestion.votes} />}
                  </div>
                </div>
                <ToastContainer toasts={toasts} />
              </div>
            );
          }

          return null; // Safety fallback
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
